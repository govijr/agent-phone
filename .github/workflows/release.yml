name: Release

# Push a tag like v0.2.0 to build the Apple silicon binary and publish a GitHub release with it
# and its SHA-256. install.sh and `agent-phone upgrade` download from the latest release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable

      - name: Check the tag matches Cargo.toml
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | python3 -c "import json,sys; print(json.load(sys.stdin)['packages'][0]['version'])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME but Cargo.toml says $version"; exit 1; }

      - run: cargo test --release
      - run: cargo build --release

      - name: Package
        run: |
          name=agent-phone-$GITHUB_REF_NAME-aarch64-apple-darwin
          mkdir -p dist
          tar -czf dist/$name.tar.gz -C target/release agent-phone
          (cd dist && shasum -a 256 $name.tar.gz > $name.tar.gz.sha256)

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
